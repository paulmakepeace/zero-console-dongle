# Draft. Not yet compiled or flashed. Pin choices match docs/hardware.md.
esphome:
  name: zero-console-dongle
  friendly_name: Zero console dongle

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  # UART0 is wanted for the USB passthrough; keep the logger off it.
  baud_rate: 0

api:
ota:
  - platform: esphome

external_components:
  - source: github://oxan/esphome-stream-server

uart:
  id: mbb_uart
  tx_pin: GPIO17   # to OBD 9 (MBB RX)
  rx_pin: GPIO16   # from OBD 8 (MBB TX)
  baud_rate: 115200

stream_server:
  uart_id: mbb_uart
  port: 6638

canbus:
  - platform: esp32_can
    id: bike_can
    tx_pin: GPIO5
    rx_pin: GPIO4
    can_id: 0
    bit_rate: 500kbps
    on_frame:
      - can_id: 0
        can_id_mask: 0
        then:
          - lambda: |-
              ESP_LOGD("can", "id=0x%03X len=%d", can_id, x.size());
