; Zero console dongle, phase 1. Arduino framework on the AITRIP ESP32 DevKit V1.
[env:devkit]
; pioarduino platform: Arduino core 3.x on ESP-IDF 5. The registry's own
; espressif32 is the old core and does not build this.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=1
build_src_flags = -Wall -Wextra   ; our sources only; the core and WiFiManager are noisy
lib_deps =
    tzapu/WiFiManager@2.0.17
