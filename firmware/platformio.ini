; Zero console dongle, phase 1. Arduino framework on the AITRIP ESP32 DevKit V1.
[platformio]
default_envs = devkit   ; pio run builds the board; pio test -e native runs the host tests

[env:devkit]
; pioarduino platform: Arduino core 3.x on ESP-IDF 5. The registry's own
; espressif32 is the old core and does not build this.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=1
build_src_flags = -Wall -Wextra   ; our sources only; the core and WiFiManager are noisy

; Host tests for src/pure, the Arduino-free logic: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Isrc/pure -Ilib/uzlib -lz   ; the tests inflate with the host zlib
lib_deps = uzlib
